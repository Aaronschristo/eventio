<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventio - College Event Discovery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <a href="#" class="logo">Eventio.</a>

            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search events...">
            </div>

            <div class="header-actions">
                <button id="createEventBtn" class="btn btn-primary">Create Event</button>
                <button id="authBtn" class="btn btn-secondary">Login</button>
                <button id="themeToggle" class="btn-icon" aria-label="Toggle Theme">
                    <!-- Sun Icon -->
                    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <!-- Moon Icon -->
                    <svg class="moon-icon hidden" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section id="hero" class="hero">
        <div class="hero-content">
            <h1>Discover <span class="highlight">Campus Life</span></h1>
            <p>The central hub for all college events, hackathons, and cultural fests.</p>
        </div>
    </section>

    <!-- Filter & Feed -->
    <main class="main-content">
        <div class="filter-container">
            <button class="filter-btn active" data-category="All">All</button>
            <button class="filter-btn" data-category="Tech">Tech</button>
            <button class="filter-btn" data-category="Cultural">Cultural</button>
            <button class="filter-btn" data-category="Workshop">Workshops</button>
        </div>

        <div id="eventFeed" class="event-grid">
            <!-- Event cards will be injected here via JS -->
        </div>

        <!-- Event Detail View (Initially Hidden) -->
        <section id="eventDetail" class="event-detail-view hidden">
            <button id="backBtn" class="btn btn-secondary back-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Feed
            </button>

            <div class="detail-container">
                <div class="detail-header">
                    <img id="detailImage" src="" alt="Event Poster" class="detail-poster">
                    <div class="detail-title-block">
                        <span id="detailDate" class="detail-date badge-date"></span>
                        <h1 id="detailTitle"></h1>
                        <p id="detailOrganizer" class="detail-organizer"></p>
                        <span id="detailStatus" class="badge-status"></span>
                    </div>
                </div>

                <div class="detail-body">
                    <div class="detail-info">
                        <h3>About the Event</h3>
                        <p id="detailDescription"></p>

                        <div class="meta-grid">
                            <div class="meta-item">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                    <line x1="16" y1="2" x2="16" y2="6"></line>
                                    <line x1="8" y1="2" x2="8" y2="6"></line>
                                    <line x1="3" y1="10" x2="21" y2="10"></line>
                                </svg>
                                <div>
                                    <strong>Date & Time</strong>
                                    <p id="detailTime"></p>
                                </div>
                            </div>
                            <div class="meta-item">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                    <circle cx="12" cy="10" r="3"></circle>
                                </svg>
                                <div>
                                    <strong>Venue</strong>
                                    <p id="detailVenue"></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="detail-actions">
                        <a id="detailLink" href="#" target="_blank" class="btn btn-primary btn-lg full-width">Register
                            Now (Google Form)</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Create Event Modal -->
    <div id="createModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" data-target="createModal">&times;</span>
            <h2>Create New Event</h2>
            <div class="modal-scroll-area">
                <form id="createEventForm">
                    <div class="form-group">
                        <label for="eventName">Event Name</label>
                        <input type="text" id="eventName" placeholder="e.g. Hackathon 2024" required>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="eventOrganizer">Organizer (Club/Dept)</label>
                            <input type="text" id="eventOrganizer" placeholder="e.g. Tech Club" required>
                        </div>
                        <div class="form-group">
                            <label for="eventCategory">Category</label>
                            <select id="eventCategory">
                                <option value="Tech">Tech</option>
                                <option value="Cultural">Cultural</option>
                                <option value="Workshop">Workshop</option>
                                <option value="Sports">Sports</option>
                                <option value="Others">Others</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="eventDate">Date</label>
                            <input type="date" id="eventDate" required>
                        </div>
                        <div class="form-group">
                            <label for="eventTime">Time</label>
                            <input type="text" id="eventTime" placeholder="e.g. 10:00 AM - 5:00 PM">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="eventVenue">Venue</label>
                        <input type="text" id="eventVenue" placeholder="e.g. Main Auditorium">
                    </div>
                    <div class="form-group">
                        <label for="eventImage">Image URL (Poster)</label>
                        <input type="url" id="eventImage" placeholder="https://example.com/poster.jpg">
                    </div>
                    <div class="form-group">
                        <label for="eventDescription">Description</label>
                        <textarea id="eventDescription" rows="4"
                            placeholder="Tell us more about the event..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="eventLink">Registration Link (Google Form)</label>
                        <input type="url" id="eventLink" placeholder="https://forms.gle/...">
                    </div>
                    <button type="submit" class="btn btn-primary full-width">Publish Event</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Auth Modal -->
    <div id="authModal" class="modal">
        <div class="modal-content auth-content">
            <span class="close-btn" data-target="authModal">&times;</span>
            <h2 id="authTitle">Welcome to Eventio</h2>
            <p class="auth-subtitle">Sign in to create and manage events</p>

            <form id="authForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="student@college.edu" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary full-width">Continue with Email</button>
            </form>

            <div class="divider">OR</div>

            <button id="googleAuthBtn" class="btn btn-google full-width">
                <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M17.64 9.2c0-.637-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"
                        fill="#4285F4" />
                    <path
                        d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.715H.957v2.332A8.997 8.997 0 0 0 9 18z"
                        fill="#34A853" />
                    <path
                        d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"
                        fill="#FBBC05" />
                    <path
                        d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.271C4.672 5.14 6.656 3.58 9 3.58z"
                        fill="#EA4335" />
                </svg>
                Continue with Google
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
